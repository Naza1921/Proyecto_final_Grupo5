<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>Editor de niveles</title>
<style>
:root{--bg:#0f1318;--pn:#181e26;--ln:#2b3542;--tx:#d6dee8;--mu:#7d8b9c;--ac:#c2438f}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:14px ui-monospace,Menlo,Consolas,monospace;display:flex}
aside{width:290px;padding:14px;background:var(--pn);border-right:1px solid var(--ln);overflow:auto;flex:none}
main{flex:1;overflow:auto;position:relative;display:flex;align-items:center;justify-content:center}
h3{margin:14px 0 6px;font-size:13px;color:var(--mu);font-weight:500}
#pal{display:grid;grid-template-columns:repeat(7,32px);gap:2px;justify-content:start}
#pal canvas{width:32px;height:32px;image-rendering:pixelated;outline:1px solid var(--ln);cursor:pointer;background:#000}
#pal canvas.sel{outline:2px solid var(--ac);z-index:1}
#pal canvas.air{opacity:.35}
button,select,input{background:var(--bg);color:var(--tx);border:1px solid var(--ln);padding:5px 8px;font:inherit;border-radius:3px}
button{cursor:pointer}button:hover,button.on{border-color:var(--ac)}button.on{color:#fff}
input[type=number]{width:64px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:4px 0}
#info{color:var(--mu);margin-top:10px;line-height:1.5}
#info b{color:var(--tx);font-weight:500}
canvas#c{display:block;image-rendering:pixelated;cursor:crosshair;background:#0a0d11}
label{display:flex;gap:5px;align-items:center}
#mpal{display:flex;flex-direction:column;gap:3px}
.mk{display:flex;gap:8px;align-items:center;padding:4px 6px;border:1px solid var(--ln);border-radius:3px;cursor:pointer;background:var(--bg)}
.mk:hover{border-color:var(--mu)}
.mk.sel{border-color:var(--ac);outline:1px solid var(--ac)}
.mk i{flex:none;width:24px;height:24px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:700;color:#000;border:1px solid var(--ln)}
.mk span{display:flex;flex-direction:column;line-height:1.3;font-size:12px}
.mk span em{font-style:normal;color:var(--mu);font-size:11px}
</style></head><body>
<aside>
<h3>Tile (índice = fila × 7 + columna)</h3><div id="pal"></div>
<h3>Marcadores (canales G y B)</h3><div id="mpal"></div>
<label style="margin-top:6px"><input type="checkbox" id="sm" checked> Mostrar marcadores</label>
<h3>Herramienta</h3>
<div class="row"><button id="t-p" class="on">Lápiz (B)</button><button id="t-f">Relleno (F)</button><button id="t-e">Aire (E)</button></div>
<h3>Mapa</h3>
<div class="row"><input id="w" type="number" value="42" min="1"> × <input id="h" type="number" value="23" min="1"><button id="new">Nuevo</button></div>
<div class="row">Zoom <input id="z" type="range" min="4" max="32" value="16"> <span id="zv">16</span><button id="fit">Ajustar</button></div>
<label><input type="checkbox" id="hb"> Mostrar hitbox (sólido)</label>
<label><input type="checkbox" id="gr" checked> Cuadrícula</label>
<h3>Codificación del rojo</h3>
<select id="enc"><option value="1">R = índice (tu código actual)</option><option value="8">R = índice × 8 (más visible)</option></select>
<h3>Archivo</h3>
<div class="row"><button id="exp">Exportar PNG</button><button id="imp">Importar PNG</button></div>
<input id="file" type="file" accept="image/png" hidden>
<div id="info"></div>
</aside>

const $=id=>document.getElementById(id);
let W=42,H=23,Z=16,sel=0,tool='p',data=new Uint8Array(W*H).fill(AIRE),down=false;

const MK=[
 {g:0,b:0,n:'Sin marcador',c:null,s:''},
 {g:1,b:0,n:'Inicio de patrulla del fantasma',c:'#3ddc84',s:'▶'},
 {g:2,b:0,n:'Rata infestada',c:'#c98a3a',s:'R'},

const hex2=n=>n.toString(16).padStart(2,'0');
const mkHex=m=>'#'+hex2(0)+hex2(m.g)+hex2(m.b);
const mkRGB=m=>'0, '+m.g+', '+m.b;
const cv=$('c'),ctx=cv.getContext('2d');
const solid=v=>v<28&&v%COLS!==AIRE;
function buildPal(){
  const p=$('pal');p.innerHTML='';
  for(let i=0;i<NT;i++){
    const c=document.createElement('canvas');c.width=c.height=T;
    if(i>=28)hole(c.getContext('2d'),0,0,T,i);else c.getContext('2d').drawImage(atlas,(i%COLS)*T,Math.floor(i/COLS)*T,T,T,0,0,T,T);
    c.title='índice '+i+(i===28?' (agujero: siguiente sección)':i===29?' (agujero: sección anterior)':i%COLS===AIRE?' (aire)':'');
    if(i<28&&i%COLS===AIRE)c.classList.add('air');

  }
}
function buildMk(){
  const p=$('mpal');p.innerHTML='';
  MK.forEach((m,i)=>{
    const d=document.createElement('div');d.className='mk';d.dataset.i=i;
    d.innerHTML='<i style="background:'+(m.c||'transparent')+'">'+m.s+'</i><span><b style="font-weight:500">'+mkRGB(m)+' — '+mkHex(m)+'</b><em>'+m.n+'</em></span>';

  });
}
function drawCell(x,y){
  const v=data[y*W+x],px=x*Z,py=y*Z;

  ctx.fillStyle=((x+y)&1)?'#141a21':'#10151b';ctx.fillRect(px,py,Z,Z);
  if(v>=28)hole(ctx,px,py,Z,v);else if(v%COLS!==AIRE)ctx.drawImage(atlas,(v%COLS)*T,Math.floor(v/COLS)*T,T,T,px,py,Z,Z);

  cv.width=W*Z;cv.height=H*Z;ctx.imageSmoothingEnabled=false;

  if(layer==='m'){const m=MK[msel];$('info').innerHTML='Capa: <b>marcadores</b><br>'+m.n+'<br>Canales G,B a pintar: <b>'+m.g+', '+m.b+'</b> (el rojo del tile no cambia)<br>Valor solo marcador: RGB('+mkRGB(m)+') · '+mkHex(m);return}

function setTool(t){tool=t;['p','f','e'].forEach(k=>$('t-'+k).classList.toggle('on',k===t))}
